name: Déployer le site sur GitHub Pages

# Se déclenche automatiquement à chaque fois que du code est poussé sur main.
# Peut aussi être lancé manuellement depuis l'onglet "Actions" du dépôt GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          # Même version que sur l'ordinateur de développement (Node.js 24,
          # maintenue jusqu'en avril 2028). Vite 8 demande au minimum la 20.19.
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Contrôles avant la mise en ligne : si l'un d'eux échoue, le workflow
      # s'arrête ici et le site en ligne reste tel quel (rien de cassé n'est
      # publié). Le détail de l'erreur s'affiche dans l'onglet "Actions".
      - name: Vérifier les types (TypeScript)
        run: npm run typecheck

      - name: Vérifier le code (ESLint)
        run: npm run lint

      - name: Construire le site et générer les pages
        # "npm run build" construit le site, puis génère une vraie page HTML
        # par adresse (/, /portfolio/, /portfolio/sports/, /about/...), la
        # page 404.html et le sitemap.xml (voir scripts/prerender.mjs).
        run: npm run build

      # Tests automatiques dans un vrai navigateur (dossier tests/) : chaque
      # page s'affiche sans erreur, aucun lien n'est cassé, le portfolio, la
      # visionneuse, le formulaire, le thème et le bandeau cookies marchent,
      # sur ordinateur et sur mobile. Si un test échoue, rien n'est publié.
      - name: Installer le navigateur des tests
        run: npx playwright install --with-deps chromium

      - name: Lancer les tests automatiques
        run: npm test

      # En cas d'échec, le rapport détaillé (captures, déroulé du test) est
      # téléchargeable en bas de la page du workflow, rubrique "Artifacts".
      - name: Garder le rapport des tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-des-tests
          path: playwright-report
          retention-days: 14

      - name: Préparer le déploiement GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaqueter le dossier dist/
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
