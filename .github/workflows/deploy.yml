name: Déployer le site sur GitHub Pages

# Se déclenche automatiquement à chaque fois que du code est poussé sur main.
# Peut aussi être lancé manuellement depuis l'onglet "Actions" du dépôt GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Contrôles avant la mise en ligne : si l'un d'eux échoue, le workflow
      # s'arrête ici et le site en ligne reste tel quel (rien de cassé n'est
      # publié). Le détail de l'erreur s'affiche dans l'onglet "Actions".
      - name: Vérifier les types (TypeScript)
        run: npm run typecheck

      - name: Vérifier le code (ESLint)
        run: npm run lint

      - name: Construire le site et générer les pages
        # "npm run build" construit le site, puis génère une vraie page HTML
        # par adresse (/, /portfolio/, /portfolio/sports/, /about/...), la
        # page 404.html et le sitemap.xml (voir scripts/prerender.mjs).
        run: npm run build

      - name: Préparer le déploiement GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaqueter le dossier dist/
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
