name: Déployer le site sur GitHub Pages

# Se déclenche automatiquement à chaque fois que du code est poussé sur main.
# Peut aussi être lancé manuellement depuis l'onglet "Actions" du dépôt GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build

      - name: Dupliquer index.html en 404.html
        # Filet de sécurité pour les URLs non prévues (ex: /portfolio?photo=xxx) :
        # sans ça, ces liens précis renverraient une vraie page d'erreur.
        run: cp dist/index.html dist/404.html

      - name: Créer un vrai index.html par page (/portfolio, /about, /contact)
        # Indispensable pour le SEO : sans ça, GitHub Pages répond avec un
        # code HTTP 404 sur ces URLs (même si le 404.html ci-dessus affiche
        # la bonne page à l'écran), et Google refuse d'indexer une page qui
        # renvoie un 404, quel que soit son contenu visuel.
        # Ici, chaque route a son propre fichier réel : le serveur répond
        # alors avec un vrai code 200. Le contenu est identique (c'est une
        # SPA), seul le code HTTP change.
        run: |
          mkdir -p dist/portfolio dist/about dist/contact dist/mentions-legales
          cp dist/index.html dist/portfolio/index.html
          cp dist/index.html dist/about/index.html
          cp dist/index.html dist/contact/index.html
          cp dist/index.html dist/mentions-legales/index.html

      - name: Préparer le déploiement GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaqueter le dossier dist/
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4