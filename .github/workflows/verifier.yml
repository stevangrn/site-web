name: Vérifier les modifications

# Se lance sur chaque "pull request" vers main, notamment celles ouvertes
# chaque mois par Dependabot (.github/dependabot.yml). Il fait les mêmes
# contrôles que le déploiement, sans rien mettre en ligne : une coche verte
# sur la pull request veut dire que le site se construit toujours.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types (TypeScript)
        run: npm run typecheck

      - name: Vérifier le code (ESLint)
        run: npm run lint

      - name: Construire le site et générer les pages
        run: npm run build
