name: Vérifier les modifications

# Se lance sur chaque "pull request" vers main, notamment celles ouvertes
# chaque mois par Dependabot (.github/dependabot.yml). Il fait les mêmes
# contrôles et les mêmes tests que le déploiement, sans rien mettre en
# ligne : une coche verte sur la pull request veut dire que le site se
# construit et fonctionne toujours.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types (TypeScript)
        run: npm run typecheck

      - name: Vérifier le code (ESLint)
        run: npm run lint

      - name: Construire le site et générer les pages
        run: npm run build

      # Tests automatiques dans un vrai navigateur (dossier tests/) : chaque
      # page s'affiche sans erreur, aucun lien n'est cassé, le portfolio, la
      # visionneuse, le formulaire, le thème et le bandeau cookies marchent,
      # sur ordinateur et sur mobile. Si un test échoue, rien n'est publié.
      - name: Installer le navigateur des tests
        run: npx playwright install --with-deps chromium

      - name: Lancer les tests automatiques
        run: npm test

      # En cas d'échec, le rapport détaillé (captures, déroulé du test) est
      # téléchargeable en bas de la page du workflow, rubrique "Artifacts".
      - name: Garder le rapport des tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-des-tests
          path: playwright-report
          retention-days: 14
