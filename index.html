<!doctype html>
<html lang="fr">
  <head>
    <!-- Google Tag Manager : chargé conditionnellement depuis src/lib/gtm.ts,
         uniquement après consentement de l'utilisateur (bandeau RGPD). -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- Applique le thème clair/sombre avant le premier affichage, pour éviter
         un "flash" de fond sombre chez les personnes en mode clair. -->
    <script>
      try {
        var theme = localStorage.getItem('portfolio-theme');
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) {}
    </script>
    <meta name="robots" content="index, follow" />
    <title>Stevan Garon — Photographe & Télépilote de drone en Vendée</title>
    <meta name="description" content="Photographe basé à La Chaize-le-Vicomte (Vendée). Portraits, événements, sports et prises de vue aériennes par drone." />
    <link rel="canonical" href="https://stevangaron.fr/" />
    <meta property="og:title" content="Stevan Garon — Photographe & Télépilote de drone en Vendée" />
    <meta property="og:description" content="Photographe basé à La Chaize-le-Vicomte (Vendée). Portraits, événements, sports et prises de vue aériennes par drone." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://stevangaron.fr/" />
    <meta property="og:site_name" content="Stevan Garon Photographe" />
    <!-- Image de partage : public/og-image.png (1200 × 630), copiée telle
         quelle à la racine du site au build, donc son adresse ne change pas. -->
    <meta property="og:image" content="https://stevangaron.fr/og-image.png" />
    <meta property="og:image:secure_url" content="https://stevangaron.fr/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo Stevan Garon — photographe et télépilote de drone en Vendée" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stevan Garon — Photographe & Télépilote de drone en Vendée" />
    <meta name="twitter:description" content="Photographe basé à La Chaize-le-Vicomte (Vendée). Portraits, événements, sports et prises de vue aériennes par drone." />
    <meta name="twitter:image" content="https://stevangaron.fr/og-image.png" />
    <meta name="twitter:image:alt" content="Logo Stevan Garon — photographe et télépilote de drone en Vendée" />
    <!-- Police Inter : hébergée avec le site (voir src/main.tsx), plus de
         Google Fonts. L'image d'accueil est préchargée par un petit script
         ajouté automatiquement au build (voir vite.config.ts). -->
    <link rel="icon" type="image/png" href="static/logo.png">
    <link rel="apple-touch-icon" href="static/logo.png">
    <!-- Données structurées Schema.org : aide Google à comprendre qu'il s'agit
         d'une activité locale (peut faire apparaître des infos enrichies dans
         les résultats de recherche). Voir plan SEO, point 2.3. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Stevan Garon Photographe",
        "image": "https://stevangaron.fr/og-image.png",
        "url": "https://stevangaron.fr/",
        "telephone": "+33627245673",
        "email": "stevan.garon@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "La Chaize-le-Vicomte",
          "addressRegion": "Vendée",
          "addressCountry": "FR"
        },
        "areaServed": ["La Chaize-le-Vicomte", "La Roche-sur-Yon", "Fontenay-le-Comte", "Vendée"],
        "sameAs": ["https://www.instagram.com/stevan_raw/"],
        "priceRange": "€€"
      }
    </script>
  </head>

    <div id="root"></div>

  </body>
</html>
